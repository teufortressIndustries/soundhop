name: CI & Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/autorestart.conf > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Static analysis & linting (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & integration test suite
        run: cargo test --workspace

  build-appimage:
    name: Build Universal Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "a";' | sudo tee /etc/needrestart/conf.d/autorestart.conf > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libssl-dev wget curl ca-certificates file \
            zstd zsync binutils squashfs-tools appstream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> build/appimage-container/cargo-target

      - name: Build AppImage
        run: |
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p build/appimage-container dist
          chmod +x packaging/container-build.sh
          ./packaging/container-build.sh

      - name: Verify AppImage Execution
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --appimage-extract-and-run version
          ./dist/*.AppImage --appimage-extract-and-run doctor || true

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Release Executables
        shell: pwsh
        run: |
          cargo build --release --workspace
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/soundhop.exe dist/SoundHop.exe

      - name: Verify Executable Created
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SoundHop.exe")) {
            throw "dist/SoundHop.exe was not created!"
          }
          ./dist/SoundHop.exe version

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: |
            dist/SoundHop.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-appimage, build-windows]
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: dist

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: dist

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum SoundHop*.AppImage SoundHop*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/SoundHop.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
