name: CI & Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_beta:
        description: "Publish a beta prerelease GitHub Release"
        required: false
        type: boolean
        default: true
      tag_suffix:
        description: "Prerelease suffix appended to workspace version (e.g. beta.1 -> beta-v2.6.2-beta.1)"
        required: false
        type: string
        default: "beta.1"
      release_tag:
        description: "Optional explicit tag override (must NOT start with 'v' to avoid colliding with stable v* releases)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update -qq && \
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
              libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libgl1-mesa-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio && break || sleep 3
          done

      - name: Install GStreamer (MSVC x86_64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gstVersion = "1.24.13"
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$gstVersion/msvc"
          $runtimeMsi = Join-Path $env:RUNNER_TEMP "gstreamer-1.0-msvc-x86_64-$gstVersion.msi"
          $develMsi = Join-Path $env:RUNNER_TEMP "gstreamer-1.0-devel-msvc-x86_64-$gstVersion.msi"

          foreach ($item in @(
            @{ Url = "$baseUrl/gstreamer-1.0-msvc-x86_64-$gstVersion.msi"; Out = $runtimeMsi; Label = "runtime" },
            @{ Url = "$baseUrl/gstreamer-1.0-devel-msvc-x86_64-$gstVersion.msi"; Out = $develMsi; Label = "devel" }
          )) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading GStreamer $($item.Label) MSI (attempt $attempt)..."
                Invoke-WebRequest -Uri $item.Url -OutFile $item.Out -UseBasicParsing
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds 5
              }
            }
          }

          Write-Host "Installing GStreamer runtime MSI..."
          $p1 = Start-Process msiexec.exe -ArgumentList "/i", "`"$runtimeMsi`"", "ADDLOCAL=ALL", "/qn", "/norestart" -Wait -PassThru -NoNewWindow
          if ($p1.ExitCode -ne 0) { throw "GStreamer runtime MSI install failed with exit code $($p1.ExitCode)" }

          Write-Host "Installing GStreamer devel MSI..."
          $p2 = Start-Process msiexec.exe -ArgumentList "/i", "`"$develMsi`"", "ADDLOCAL=ALL", "/qn", "/norestart" -Wait -PassThru -NoNewWindow
          if ($p2.ExitCode -ne 0) { throw "GStreamer devel MSI install failed with exit code $($p2.ExitCode)" }

          if (-not (Test-Path "$gstRoot\lib\pkgconfig\gstreamer-1.0.pc")) {
            throw "Expected gstreamer-1.0.pc not found under $gstRoot\lib\pkgconfig"
          }

          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            "PKG_CONFIG=$gstRoot\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$gstRoot\bin\gst-inspect-1.0.exe" --version
          Remove-Item -Force $runtimeMsi, $develMsi -ErrorAction SilentlyContinue

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Verify packaging version consistency
        run: cargo xtask bump-version --check

      - name: Static analysis & linting (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit & integration test suite
        run: cargo test --workspace --locked

      - name: Verify headless CLI build & unit tests (no GUI feature)
        run: |
          cargo check -p soundhop-cli --no-default-features --bin soundhop --locked
          cargo test -p soundhop-cli --no-default-features --lib --locked

  build-appimage:
    name: Build AnyLinux AppImage
    needs: [test]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch Linux build dependencies
        run: |
          for i in 1 2 3; do
            pacman -Sy --noconfirm --needed archlinux-keyring && \
            pacman -Syu --noconfirm --needed \
              base-devel rustup pkgconf wget curl file strace binutils patchelf zsync \
              squashfs-tools desktop-file-utils appstream xorg-server-xvfb \
              gtk3 libayatana-appindicator xdotool libxcb libxcursor libxi libxrandr \
              libxkbcommon libxkbcommon-x11 wayland mesa \
              gstreamer gst-plugins-base-libs gst-plugins-base gst-plugins-good gst-plugins-bad \
              git && break || sleep 3
          done

      - name: Initialize Rust toolchain
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> build/appimage-container/cargo-target

      - name: Build AnyLinux AppImage
        run: |
          mkdir -p build/appimage-container dist
          chmod +x packaging/container-build.sh packaging/verify-appimage.sh
          ./packaging/container-build.sh

      - name: Verify AppImage Execution
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage version
          ./dist/*.AppImage doctor || true
          ./dist/*.AppImage --appimage-extract-and-run version
          ./build/appimage-container/quick-sharun.sh --simple-test ./dist/*.AppImage version

      - name: Verify AppImage Metadata & Updates
        run: |
          for appimage in dist/*.AppImage; do
            ./packaging/verify-appimage.sh "$appimage"
          done

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer & Portable ZIP
    needs: [test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer (MSVC x86_64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gstVersion = "1.24.13"
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$gstVersion/msvc"
          $runtimeMsi = Join-Path $env:RUNNER_TEMP "gstreamer-1.0-msvc-x86_64-$gstVersion.msi"
          $develMsi = Join-Path $env:RUNNER_TEMP "gstreamer-1.0-devel-msvc-x86_64-$gstVersion.msi"

          foreach ($item in @(
            @{ Url = "$baseUrl/gstreamer-1.0-msvc-x86_64-$gstVersion.msi"; Out = $runtimeMsi; Label = "runtime" },
            @{ Url = "$baseUrl/gstreamer-1.0-devel-msvc-x86_64-$gstVersion.msi"; Out = $develMsi; Label = "devel" }
          )) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading GStreamer $($item.Label) MSI (attempt $attempt)..."
                Invoke-WebRequest -Uri $item.Url -OutFile $item.Out -UseBasicParsing
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds 5
              }
            }
          }

          Write-Host "Installing GStreamer runtime MSI..."
          $p1 = Start-Process msiexec.exe -ArgumentList "/i", "`"$runtimeMsi`"", "ADDLOCAL=ALL", "/qn", "/norestart" -Wait -PassThru -NoNewWindow
          if ($p1.ExitCode -ne 0) { throw "GStreamer runtime MSI install failed with exit code $($p1.ExitCode)" }

          Write-Host "Installing GStreamer devel MSI..."
          $p2 = Start-Process msiexec.exe -ArgumentList "/i", "`"$develMsi`"", "ADDLOCAL=ALL", "/qn", "/norestart" -Wait -PassThru -NoNewWindow
          if ($p2.ExitCode -ne 0) { throw "GStreamer devel MSI install failed with exit code $($p2.ExitCode)" }

          if (-not (Test-Path "$gstRoot\lib\pkgconfig\gstreamer-1.0.pc")) {
            throw "Expected gstreamer-1.0.pc not found under $gstRoot\lib\pkgconfig"
          }

          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            "PKG_CONFIG=$gstRoot\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$gstRoot\bin\gst-inspect-1.0.exe" --version
          Remove-Item -Force $runtimeMsi, $develMsi -ErrorAction SilentlyContinue

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify packaging version consistency
        run: cargo xtask bump-version --check

      - name: Build & Package Windows Release (Installer + Portable ZIP)
        shell: pwsh
        run: |
          .\packaging\windows\build-windows.ps1 -RequireInstaller

      - name: Verify Windows Artifacts & Smoke Test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "SoundHop-*-windows-x86_64-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -Filter "SoundHop-*-windows-x86_64-portable.zip" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer .exe was not created!" }
          if (-not $portable) { throw "Windows portable .zip was not created!" }
          if (-not (Test-Path "dist/SHA256SUMS.txt")) { throw "dist/SHA256SUMS.txt was not created!" }

          $verifyDir = Join-Path $env:RUNNER_TEMP "soundhop-portable-verify"
          if (Test-Path $verifyDir) { Remove-Item -Recurse -Force $verifyDir }
          Expand-Archive -Path $portable.FullName -DestinationPath $verifyDir -Force

          $cli = Get-ChildItem -Path $verifyDir -Recurse -Filter "soundhop.exe" | Select-Object -First 1
          $gui = Get-ChildItem -Path $verifyDir -Recurse -Filter "soundhop-gui.exe" | Select-Object -First 1
          if (-not $cli) { throw "soundhop.exe missing from portable zip!" }
          if (-not $gui) { throw "soundhop-gui.exe missing from portable zip!" }

          $pkgRoot = $cli.Directory.FullName
          $pluginDir = Join-Path $pkgRoot "lib\gstreamer-1.0"
          foreach ($plugin in @(
            "gstcoreelements.dll", "gstaudioconvert.dll", "gstaudioresample.dll",
            "gstvolume.dll", "gstopus.dll", "gstrtp.dll", "gstrtpmanager.dll",
            "gstsrtp.dll", "gstudp.dll", "gstwasapi2.dll", "gstapp.dll"
          )) {
            if (-not (Test-Path (Join-Path $pluginDir $plugin))) {
              throw "Bundled GStreamer plugin missing from portable zip: lib\gstreamer-1.0\$plugin"
            }
          }

          # Run smoke test with a stripped PATH (no system GStreamer) to prove self-contained DLL resolution
          $savedPath = $env:PATH
          $savedGstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64 -ErrorAction SilentlyContinue
            & $cli.FullName --version
            if ($LASTEXITCODE -ne 0) { throw "soundhop.exe --version failed with stripped PATH!" }
          } finally {
            $env:PATH = $savedPath
            if ($null -ne $savedGstRoot) { $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 = $savedGstRoot }
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-Windows-x86_64
          path: |
            dist/SoundHop-*-windows-x86_64-setup.exe
            dist/SoundHop-*-windows-x86_64-portable.zip
          if-no-files-found: error

  build-linux-aarch64:
    name: Build Linux aarch64 Headless CLI
    needs: [test]
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux aarch64 GStreamer dependencies
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update -qq && \
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio && break || sleep 3
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build headless CLI binary (aarch64-unknown-linux-gnu)
        run: cargo build --release -p soundhop-cli --no-default-features --features gstreamer --bin soundhop --locked

      - name: Smoke test & package headless tarball
        run: |
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to determine workspace version from Cargo.toml" >&2
            exit 1
          fi
          ./target/release/soundhop --version
          PKG_DIR="soundhop-${VERSION}-linux-aarch64-headless"
          mkdir -p "dist/${PKG_DIR}"
          install -Dm755 target/release/soundhop "dist/${PKG_DIR}/soundhop"
          install -Dm644 README.md "dist/${PKG_DIR}/README.md"
          install -Dm644 LICENSE "dist/${PKG_DIR}/LICENSE"
          install -Dm644 CHANGELOG.md "dist/${PKG_DIR}/CHANGELOG.md"
          cat << 'EOF' > "dist/${PKG_DIR}/README-HEADLESS.txt"
          SoundHop Linux aarch64 Headless CLI
          ===================================

          Runtime Dependencies (Debian / Ubuntu / Raspberry Pi OS):
            sudo apt-get update
            sudo apt-get install -y \
              libgstreamer1.0-0 \
              gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad \
              gstreamer1.0-pulseaudio \
              pipewire-pulse

          Verify runtime readiness:
            ./soundhop doctor
          EOF
          tar -C dist -czf "dist/${PKG_DIR}.tar.gz" "${PKG_DIR}"
          rm -rf "dist/${PKG_DIR}"
          ls -lh "dist/${PKG_DIR}.tar.gz"

      - name: Upload Linux aarch64 Headless Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-Linux-aarch64-headless
          path: dist/soundhop-*-linux-aarch64-headless.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_beta)
    needs: [test, build-appimage, build-windows, build-linux-aarch64]
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to determine workspace version from Cargo.toml" >&2
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            SUFFIX="${INPUT_SUFFIX:-beta.1}"
            SUFFIX="${SUFFIX#-}"
            TAG="beta-v${VERSION}-${SUFFIX}"
          fi

          if [[ "$TAG" == v* ]]; then
            echo "Error: Beta release tag '$TAG' must not start with 'v' (would trigger stable v* release workflow)." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=SoundHop ${TAG} (Pre-release)" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          echo "make_latest=false" >> "$GITHUB_OUTPUT"

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-Windows-x86_64
          path: dist

      - name: Download Linux aarch64 Headless Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-Linux-aarch64-headless
          path: dist

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum SoundHop*.AppImage SoundHop*.zsync SoundHop*.exe SoundHop*.zip soundhop-*-linux-aarch64-headless.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.target }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/*-setup.exe
            dist/*-portable.zip
            dist/soundhop-*-linux-aarch64-headless.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
