name: CI & AppImage Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: "windows-latest"
            python-version: "3.10"
          - os: "windows-latest"
            python-version: "3.12"
          - os: "windows-latest"
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Code quality, type checking & security linting
        run: |
          ruff check src tests
          mypy src
          bandit -r src -ll -q

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

  build-appimage:
    name: Build Universal AppImage
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3 python3-pip python3-venv wget curl ca-certificates file \
            libgl1 libegl1 libxkbcommon0 libpulse0 zstd binutils squashfs-tools appstream

      - name: Build AppImage
        run: |
          # Use container-build script directly on clean Ubuntu 22.04 runner
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p build/appimage-container dist
          chmod +x packaging/container-build.sh
          ./packaging/container-build.sh

      - name: Verify AppImage Execution
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --appimage-extract-and-run version
          ./dist/*.AppImage --appimage-extract-and-run doctor || true

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pyinstaller

      - name: Build Windows Executable
        run: |
          python packaging/build-windows-exe.py

      - name: Verify Executable Created
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SoundHop.exe")) {
            throw "dist/SoundHop.exe was not created!"
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: dist/SoundHop.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-appimage, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: dist

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: dist

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum SoundHop*.AppImage SoundHop*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/SoundHop.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
