name: CI & Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update -qq && \
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
              libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libgl1-mesa-dev libssl-dev && break || sleep 3
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Static analysis & linting (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit & integration test suite
        run: cargo test --workspace --locked

  build-appimage:
    name: Build AnyLinux AppImage
    needs: [test]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install Arch Linux build dependencies
        run: |
          for i in 1 2 3; do
            pacman -Sy --noconfirm --needed archlinux-keyring && \
            pacman -Syu --noconfirm --needed \
              base-devel rustup pkgconf wget curl file strace binutils patchelf zsync \
              squashfs-tools desktop-file-utils appstream xorg-server-xvfb \
              gtk3 libayatana-appindicator xdotool libxcb libxcursor libxi libxrandr \
              libxkbcommon libxkbcommon-x11 wayland mesa openssl git && break || sleep 3
          done

      - name: Initialize Rust toolchain
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> build/appimage-container/cargo-target

      - name: Build AnyLinux AppImage
        run: |
          mkdir -p build/appimage-container dist
          chmod +x packaging/container-build.sh
          ./packaging/container-build.sh

      - name: Verify AppImage Execution
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage version
          ./dist/*.AppImage doctor || true
          ./dist/*.AppImage --appimage-extract-and-run version
          ./build/appimage-container/quick-sharun.sh --simple-test ./dist/*.AppImage version

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable
    needs: [test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Release Executables
        shell: pwsh
        run: |
          cargo build --release --workspace --locked
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/soundhop.exe dist/SoundHop.exe

      - name: Verify Executable Created
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SoundHop.exe")) {
            throw "dist/SoundHop.exe was not created!"
          }
          ./dist/SoundHop.exe version

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: |
            dist/SoundHop.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-appimage, build-windows]
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-x86_64.AppImage
          path: dist

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: SoundHop-Windows-x86_64.exe
          path: dist

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum SoundHop*.AppImage SoundHop*.zsync SoundHop*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zsync
            dist/SoundHop.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
