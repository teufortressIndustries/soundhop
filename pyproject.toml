[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundhop"
version = "1.1.5"
description = "Play any Linux device's audio on any other device on your local network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SoundHop contributors" }]
keywords = ["pipewire", "pulseaudio", "audio", "streaming", "lan", "mdns"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
  "sounddevice>=0.4.6; sys_platform == 'win32'",
  "soundcard>=0.4.3; sys_platform == 'win32'",
  "numpy>=1.20; sys_platform == 'win32'",
  "psutil>=5.9.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]
gui = ["PySide6>=6.5"]
all = ["zeroconf>=0.130", "PySide6>=6.5"]
dev = [
  "ruff>=0.3.0",
  "mypy>=1.9.0",
  "bandit>=1.7.8",
]

[project.scripts]
soundhop = "soundhop.cli:main"
shop = "soundhop.cli:main"

[project.urls]
Homepage = "https://github.com/teufortressIndustries/soundhop"
Issues = "https://github.com/teufortressIndustries/soundhop/issues"
Repository = "https://github.com/teufortressIndustries/soundhop"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soundhop = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
