[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundhop"
version = "1.1.3"
description = "Play any Linux device's audio on any other device on your local network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SoundHop contributors" }]
keywords = ["pipewire", "pulseaudio", "audio", "streaming", "lan", "mdns"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]
gui = ["PySide6>=6.5"]
all = ["zeroconf>=0.130", "PySide6>=6.5"]

[project.scripts]
soundhop = "soundhop.cli:main"
shop = "soundhop.cli:main"

[project.urls]
Homepage = "https://github.com/teufortressIndustries/soundhop"
Issues = "https://github.com/teufortressIndustries/soundhop/issues"
Repository = "https://github.com/teufortressIndustries/soundhop"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soundhop = ["assets/*.svg"]
