[package]
name = "soundhop-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native system tray and eframe/egui dialogs for SoundHop"

[dependencies]
soundhop-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
eframe.workspace = true
egui.workspace = true
tray-icon.workspace = true
muda.workspace = true
image.workspace = true

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { workspace = true, features = ["glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }
# eframe 0.31 disables wgpu default-features (omitting dx12); explicitly enable dx12
# so DirectX 12 + Microsoft WARP software fallback works on all Windows desktops/VMs/RDP.
wgpu = { version = "24", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
