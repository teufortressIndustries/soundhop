thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
clap_complete.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[dev-dependencies]
tempfile.workspace = true
