[package]
name = "soundhop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI, daemon entrypoint, and interactive TUI for SoundHop"
default-run = "soundhop"

[[bin]]
name = "soundhop"
path = "src/main.rs"

[[bin]]
name = "shop"
path = "src/bin/shop.rs"

[dependencies]
