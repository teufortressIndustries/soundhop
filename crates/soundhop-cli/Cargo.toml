[package]
name = "soundhop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI, daemon entrypoint, and interactive TUI for SoundHop"
default-run = "soundhop"

[features]
default = ["gui", "gstreamer"]
gui = ["dep:soundhop-gui"]
gstreamer = ["soundhop-core/gstreamer"]

[[bin]]
name = "soundhop"
path = "src/main.rs"

[[bin]]
name = "soundhop-gui"
path = "src/bin/soundhop_gui.rs"
required-features = ["gui"]

[dependencies]
soundhop-core = { workspace = true, default-features = false }
soundhop-gui = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
clap_complete.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
