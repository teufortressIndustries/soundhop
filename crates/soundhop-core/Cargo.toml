[package]
name = "soundhop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core library for SoundHop local network audio sharing, discovery, multi-room, and Android bridge"

[features]
default = ["opus"]
opus = ["dep:opus2", "dep:mousiki"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
socket2.workspace = true
if-addrs.workspace = true
ipnet.workspace = true
mdns-sd.workspace = true
hmac.workspace = true
sha2.workspace = true
hkdf.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
opus2 = { workspace = true, optional = true }
mousiki = { workspace = true, optional = true }
hex.workspace = true
rand.workspace = true
ureq.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
cpal.workspace = true
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile.workspace = true
