app-id: io.github.soundhop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: soundhop
command-args:
  - gui

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/soundhop/cargo

finish-args:
  # Network access for UDP 47777 discovery and TCP 4713 audio streaming
  - --share=network
  # Audio system access (PulseAudio & PipeWire compatibility socket)
  - --socket=pulseaudio
  # Display servers
  - --socket=wayland
  - --socket=fallback-x11
  # System tray integration
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # Access to user config and state directories
  - --persist=.config/soundhop
  - --persist=.local/state/soundhop

modules:
  - name: soundhop
    buildsystem: simple
    build-commands:
      # For offline Flathub builds, generate cargo-sources.json with flatpak-cargo-generator
      # and pass --offline to cargo build.
      - cargo build --release --workspace --locked
      - install -Dm755 target/release/soundhop ${FLATPAK_DEST}/bin/soundhop
      - install -Dm644 packaging/io.github.soundhop.desktop ${FLATPAK_DEST}/share/applications/io.github.soundhop.desktop
      - desktop-file-edit --set-icon=io.github.soundhop ${FLATPAK_DEST}/share/applications/io.github.soundhop.desktop
      - install -Dm644 packaging/io.github.soundhop.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.soundhop.metainfo.xml
      - install -Dm644 assets/soundhop.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.soundhop.png
      - install -Dm644 assets/soundhop.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.soundhop.svg
    sources:
      - type: dir
        path: ..
