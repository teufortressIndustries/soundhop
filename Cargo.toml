[workspace]
resolver = "2"
members = [
    "crates/soundhop-core",
    "crates/soundhop-gui",
    "crates/soundhop-cli",
    "xtask",
]
default-members = [
    "crates/soundhop-core",
    "crates/soundhop-gui",
    "crates/soundhop-cli",
]

[workspace.package]
version = "2.8.5"
edition = "2021"
license = "MIT"
authors = ["SoundHop contributors"]
repository = "https://github.com/teufortressIndustries/soundhop"

[workspace.dependencies]
soundhop-core = { path = "crates/soundhop-core", default-features = false }
soundhop-gui = { path = "crates/soundhop-gui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
ipnet = "2.10"
mdns-sd = "0.11"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
gstreamer = { version = "0.24", features = ["v1_20"] }
gstreamer-audio = { version = "0.24", features = ["v1_20"] }
gstreamer-rtp = { version = "0.24", features = ["v1_20"] }
gstreamer-app = { version = "0.24", features = ["v1_20"] }
hex = "0.4"
rand = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
qrcode = { version = "0.15", default-features = false }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
ratatui = "0.29"
crossterm = "0.28"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wayland", "x11"] }
egui = "0.31"
tray-icon = "0.19"
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
tempfile = "3.13"
cpal = "0.15"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
